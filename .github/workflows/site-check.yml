name: Site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild generated pages
        run: python3 scripts/build_articles.py
      - name: Fail if generated files are stale
        run: git diff --exit-code
      - name: Run site checks
        run: python3 scripts/check_site.py
